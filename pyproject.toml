[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wep-recon"
version = "0.1.0"
description = "Reconcile Winwize transaction history against recommendations and brokerage executions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.scripts]
wep-annotate = "wep_recon.cli:annotate_main"
wep-apply = "wep_recon.cli:apply_main"

[tool.setuptools]
packages = ["wep_recon"]
